-- conky.conf for conky-lcars
--
-- Only change HEIGHT below - the width is derived from it automatically,
-- keeping the widget's native 460:900 aspect ratio (so nothing stretches
-- or gets letterboxed). widget.lua also auto-scales its drawing to
-- whatever window size ends up here, so this one number controls the
-- whole widget's size.

local HEIGHT = 800              -- e.g. 900 = original size, 600 = compact
local ASPECT = 460 / 900        -- widget.lua's native width:height ratio
local WIDTH = math.floor(HEIGHT * ASPECT + 0.5)

conky.config = {

    alignment = 'top_left',
    gap_x = 20,
    gap_y = 40,
    
    background = true,
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_class = 'conky-lcars',

    double_buffer = true,
    update_interval = 1,

    minimum_width = WIDTH,
    minimum_height = HEIGHT,
    maximum_width = WIDTH,

    top_cpu_separate = true,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    border_width = 0,

    use_xft = true,

    lua_load = 'widget.lua',
    lua_draw_hook_pre = 'conky_main',
}

conky.text = [[
]]